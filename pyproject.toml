[project]
name = "phase8-mcp"
version = "0.1.0"
description = "MCP server for controlling a Korg Phase 8 acoustic synthesizer over MIDI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "../LICENSE" }
dependencies = [
    "mcp[cli]>=1.0.0",
    "python-rtmidi>=1.5.0",
]

[project.scripts]
phase8-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
